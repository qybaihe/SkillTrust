<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">SkillTrust Selection Precision and Rankability Uplift</title>
<desc id="desc">A before and after visualization showing taxonomy score improvement, overlap reduction, and ranked examples of Skills that become easier for Agents to select precisely after SkillTrust optimization.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#101820"/>
    <stop offset="55%" stop-color="#172a34"/>
    <stop offset="100%" stop-color="#0f1720"/>
  </linearGradient>
  <style>
    .title { font: 800 34px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f9faf4; }
    .subtitle { font: 500 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c8d2d8; }
    .label { font: 700 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f9faf4; }
    .small { font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #d8dee9; }
    .muted { font: 500 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9fb0bb; }
    .num { font: 900 28px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff7d6; }
    .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.22); stroke-width: 1.2; }
    .before { fill: #ffb45c; }
    .after { fill: #5bd6a2; }
    .accent { fill: #7cc7ff; }
  </style>
</defs>
<rect width="1000" height="640" fill="url(#bg)"/>
<circle cx="896" cy="96" r="130" fill="#244657" opacity="0.45"/>
<circle cx="90" cy="580" r="170" fill="#2d4f44" opacity="0.42"/>
<text x="50" y="62" class="title">Selection Precision / Rankability Uplift</text>
<text x="50" y="92" class="subtitle">SkillTrust does not only save tokens. It sharpens triggers, anti-triggers, and scope boundaries so the right Skill ranks higher.</text>

<rect x="50" y="126" width="430" height="270" rx="22" class="card"/>
<text x="78" y="164" class="label">Taxonomy Score Before / After</text>
<text x="78" y="190" class="muted">Projected after SkillTrust optimization plan, then re-audit.</text>

<text x="78" y="236" class="small">agent-verifier</text>
<rect x="205" y="218" width="280" height="22" rx="11" fill="#263946"/>
<rect x="205" y="218" width="4" height="22" rx="2" class="before"/>
<rect x="205" y="250" width="224" height="22" rx="11" class="after"/>
<text x="446" y="267" class="small">80+</text>
<text x="78" y="268" class="muted">0 -> 80+</text>

<text x="78" y="320" class="small">cursor-rules-awesome</text>
<rect x="205" y="302" width="280" height="22" rx="11" fill="#263946"/>
<rect x="205" y="302" width="213" height="22" rx="11" class="before"/>
<rect x="205" y="334" width="280" height="22" rx="11" class="after"/>
<text x="446" y="351" class="small">100</text>
<text x="78" y="352" class="muted">76 -> 100</text>

<rect x="520" y="126" width="430" height="270" rx="22" class="card"/>
<text x="548" y="164" class="label">Overlap and Always-On Context</text>
<text x="548" y="190" class="muted">Rankability improves when similar Skills stop competing.</text>

<rect x="548" y="220" width="170" height="110" rx="18" fill="rgba(124,199,255,0.13)" stroke="#7cc7ff" stroke-width="1.2"/>
<text x="572" y="258" class="num">6 -> 0</text>
<text x="572" y="286" class="small">overlap findings</text>
<text x="572" y="309" class="muted">agent-verifier target</text>

<rect x="748" y="220" width="170" height="110" rx="18" fill="rgba(91,214,162,0.13)" stroke="#5bd6a2" stroke-width="1.2"/>
<text x="772" y="258" class="num">4,861</text>
<text x="772" y="286" class="small">lines -> router</text>
<text x="772" y="309" class="muted">cursor rules split</text>

<text x="548" y="365" class="small">Interpretation: clearer descriptions, negative triggers, and routers help the host Agent select the right package instead of a generic neighbor.</text>

<rect x="50" y="430" width="900" height="144" rx="24" class="card"/>
<text x="78" y="468" class="label">Projected Precision-Gain Ranking</text>

<g transform="translate(78 496)">
  <circle cx="12" cy="12" r="12" class="accent"/><text x="8" y="17" font-size="13" font-weight="900" fill="#10202a">1</text>
  <text x="38" y="17" class="small">agent-verifier: split overlapping verify-* triggers into orchestrator + specialized verifiers</text>
</g>
<g transform="translate(78 528)">
  <circle cx="12" cy="12" r="12" class="accent"/><text x="8" y="17" font-size="13" font-weight="900" fill="#10202a">2</text>
  <text x="38" y="17" class="small">cursor-rules-awesome: replace monolithic always-on rules with router + domain references</text>
</g>
<g transform="translate(548 496)">
  <circle cx="12" cy="12" r="12" class="accent"/><text x="8" y="17" font-size="13" font-weight="900" fill="#10202a">3</text>
  <text x="38" y="17" class="small">project-planner: bind repo scope and gate GitHub mutations</text>
</g>
<g transform="translate(548 528)">
  <circle cx="12" cy="12" r="12" class="accent"/><text x="8" y="17" font-size="13" font-weight="900" fill="#10202a">4</text>
  <text x="38" y="17" class="small">skill-creator: compact harness + deferred evaluation references</text>
</g>
<text x="78" y="604" class="muted">Caveat: this is a projected rankability signal from taxonomy and authoring evidence, not a measured production accuracy benchmark.</text>
</svg>
